[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alice"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/", "tests/", "docs/",
  "README.md", "LICENSE",
  "pyproject.toml", "mkdocs.yml",
]

[project]
name = "alice-net"
version = "0.1.6"
description = "Alice: collection of 1D tensor network algorithms"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Changkai Zhang", email = "changkai.zhang@lmu.de" }]
keywords = [
  "tensor-network", "dmrg", "xtrg", "tantrg", "tdvp", 
  "quantum", "physics", "symmetry", "mps", "mpo"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "nicole>=0.3.7",
  "numpy>=2.0",
  "torch>=2.5",
]

[project.urls]
Homepage = "https://github.com/Ideogenesis-AI/Alice"
Documentation = "https://ideogenesis-ai.github.io/Alice"
Repository = "https://github.com/Ideogenesis-AI/Alice"
Issues = "https://github.com/Ideogenesis-AI/Alice/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "hypothesis>=6.0",
  "pytest-benchmark>=4.0",
]

lint = [
  "ruff>=0.6",
  "mypy>=1.8",
]

docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-material-extensions>=1.3",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mkdocs-git-committers-plugin-2>=2.0",
  "markdown-exec[ansi]>=1.12",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Vendored, Nicole-native faithful-KLS kernel — kept close to its upstream form.
# Several modules re-export helpers consumed by sibling kernel modules, so the
# unused-import rule would force churn that breaks those re-exports.
"src/alice/algorithm/two_site_bug/_kernel/**" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
