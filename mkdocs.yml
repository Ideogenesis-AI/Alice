site_name: Alice Documentation
site_description: 1D tensor network algorithms built upon Nicole
site_author: Changkai Zhang
site_url: https://ideogenesis-ai.github.io/Alice/
repo_name: Ideogenesis-AI/Alice
repo_url: https://github.com/Ideogenesis-AI/Alice
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2025-2026 Changkai Zhang

hooks:
  - docs/hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/alice-font-awesome.png
  favicon: images/alice.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: alice
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

nav:
  - Getting Started:
    - What is Alice?: getting-started/what-is-alice.md
    - Installation: getting-started/installation.md
    - Core Concepts: getting-started/core-concepts.md
    - Quick Start: getting-started/quick-start.md
    - Development:
      - Contributing: getting-started/contributing.md
      - Git Control: getting-started/git-control.md
      - Changelog: getting-started/changelog.md
  - API Reference:
    - Overview: api/index.md
    - Logging: api/logging.md
    - Network:
      - Overview: api/network/index.md
      - Network: api/network/network.md
      - MPS: api/network/mps.md
      - MPO: api/network/mpo.md
      - observe: api/network/observe.md
    - Interaction:
      - Overview: api/interaction/index.md
      - Interaction: api/interaction/interaction.md
      - Interaction1Site: api/interaction/interaction-1site.md
      - Interaction2Site: api/interaction/interaction-2site.md
      - build_interaction: api/interaction/build-interaction.md
    - Geometry:
      - Overview: api/geometry/index.md
      - intrcmap_1dchain: api/geometry/intrcmap-1dchain.md
      - intrcmap_square: api/geometry/intrcmap-square.md
      - build_geometry: api/geometry/build-geometry.md
    - Local Space:
      - Overview: api/local-space/index.md
      - build_bosonic: api/local-space/build-bosonic.md
      - build_fermionic: api/local-space/build-fermionic.md
      - build_conductor: api/local-space/build-conductor.md
    - Hamiltonian:
      - Overview: api/hamiltonian/index.md
      - build_hamiltonian: api/hamiltonian/build-hamiltonian.md
      - build_heisenberg: api/hamiltonian/build-heisenberg.md
      - build_free_fermion: api/hamiltonian/build-free-fermion.md
      - build_hubbard: api/hamiltonian/build-hubbard.md
    - DMRG:
      - Overview: api/dmrg/index.md
      - Options: api/dmrg/options.md
      - Summary: api/dmrg/summary.md
      - Launch: api/dmrg/run.md
  - Examples:
    - Overview: examples/index.md
    - DMRG:
      - Heisenberg chain: examples/dmrg/heisenberg.md
      - Free fermion: examples/dmrg/free-fermion.md
      - Hubbard model: examples/dmrg/hubbard.md
    - AutoMPO from TOML: examples/autompo-toml.md
    - Extensions:
      - Custom geometry: examples/extensions/custom-geometry.md
      - Custom local space: examples/extensions/custom-space.md
      - Custom model: examples/extensions/custom-model.md

plugins:
  - search:
      lang: en
  - markdown-exec
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: timeago
      exclude:
        - index.md
  - git-committers:
      repository: Ideogenesis-AI/Alice
      branch: stable
      exclude:
        - index.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            show_category_heading: true
            show_if_no_docstring: false
            annotations_path: brief
            line_length: 80
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: false
            filters:
              - "!^_"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ideogenesis-AI/Alice
      name: Alice on GitHub
    - icon: fontawesome/solid/building
      link: https://github.com/Ideogenesis-AI
      name: Ideogenesis-AI Organization
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/alice-net/
      name: alice-net on PyPI
    - icon: simple/pytorch
      link: https://pytorch.org
      name: PyTorch

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
